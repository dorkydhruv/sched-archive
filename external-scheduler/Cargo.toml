[package]
name = "agave-external-scheduler"
description = "External scheduler-bindings runner hosting pluggable pack strategies"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
agave-scheduler-bindings = {workspace = true, features = ["agave-unstable-api"] }
serde ={ workspace = true, features = ["derive"]}
serde_json ={ workspace = true}
serde_with ={ workspace = true}
tokio ={ workspace = true, features = ["macros", "rt", "signal", "net"]}
solana-pubkey ={ workspace = true}
tracing = {workspace = true, features = ["log"]}
tracing-subscriber = {workspace = true, features = ["fmt"]}
agave-scheduling-utils ={ workspace = true}
tokio-util = { workspace = true }
schedulers = { workspace = true }
batch-scheduler.workspace = true
auction-batch-scheduler.workspace = true
futures = { workspace = true, features = ["alloc"] }
solana-keypair.workspace = true
toml.workspace = true
axum = { version = "0.8", features = ["json", "form"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

[dev-dependencies]
solana-compute-budget-interface = { workspace = true }
solana-hash = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
crossbeam-channel = { workspace = true }
wincode = { workspace = true }
agave-transaction-view = { workspace = true }
base64 = "0.22"
nix = "0.31.3"
shaq = { workspace = true }

[[bench]]
name = "comparative_bench"
harness = false

[[bench]]
name = "replay_bench"
harness = false
